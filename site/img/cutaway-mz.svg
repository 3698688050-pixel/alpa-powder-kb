<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img">

  <defs>
    <pattern id="tex-mz" patternUnits="userSpaceOnUse" width="880" height="705">
      <image href="tex-steel.jpg" width="880" height="705" preserveAspectRatio="xMidYMid slice"/>
    </pattern>
    <linearGradient id="steel-mz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ECEDEA"/>
      <stop offset=".18" stop-color="#F7F8F5"/>
      <stop offset=".55" stop-color="#EEEFF0"/>
      <stop offset="1" stop-color="#DDDFE1"/>
    </linearGradient>
    <marker id="ar-mz" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0 0 L6 3.5 L0 7" fill="none" stroke="#15171A" stroke-width="1.1"/>
    </marker>
    <marker id="arb-mz" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0 0 L6 3.5 L0 7" fill="none" stroke="#1A4FA0" stroke-width="1.1"/>
    </marker>
    <marker id="arg-mz" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0 0 L6 3.5 L0 7" fill="none" stroke="#1F6B43" stroke-width="1.1"/>
    </marker>
  </defs>
<style>
  .h{font:600 12.5px -apple-system,"PingFang SC",sans-serif;fill:#15171A}
  .s{font:11.5px -apple-system,"PingFang SC",sans-serif;fill:#6E747B}
</style>
<rect width="860" height="470" fill="#FBFBF9"/>
<!-- 整机居中：主体锚点 (140..580, 60..420) 平移到画布中心 -->
<g transform="translate(28, 6)">
  <!-- 磨筒 + 激振器 -->
  <g>
     <path d="M180 168 a150 42 0 0 0 300 0 a150 42 0 0 0 -300 0 z" fill="url(#steel-mz)" stroke="none"/>
     <path d="M180 168 a150 42 0 0 0 300 0 a150 42 0 0 0 -300 0 z" fill="url(#tex-mz)" opacity=".32" stroke="none"/>
     <path d="M180 168 a150 42 0 0 0 300 0 a150 42 0 0 0 -300 0 z" fill="none" stroke="#15171A" stroke-width="1.6" />
   </g>
  <ellipse cx="330" cy="168" rx="150" ry="42" fill="none" stroke="#15171A" stroke-width="1.6"/>
  <ellipse cx="330" cy="168" rx="150" ry="24" fill="none" stroke="#C9CCC7" stroke-width="1" stroke-dasharray="5 4"/>
  <!-- 研磨介质 -->
  <circle cx="222" cy="176" r="11" fill="url(#steel-mz)" stroke="#15171A" stroke-width="1.2"/><circle cx="256" cy="164" r="11" fill="url(#steel-mz)" stroke="#15171A" stroke-width="1.2"/><circle cx="290" cy="178" r="11" fill="url(#steel-mz)" stroke="#15171A" stroke-width="1.2"/><circle cx="336" cy="166" r="11" fill="url(#steel-mz)" stroke="#15171A" stroke-width="1.2"/><circle cx="374" cy="178" r="11" fill="url(#steel-mz)" stroke="#15171A" stroke-width="1.2"/><circle cx="410" cy="164" r="11" fill="url(#steel-mz)" stroke="#15171A" stroke-width="1.2"/><circle cx="442" cy="176" r="11" fill="url(#steel-mz)" stroke="#15171A" stroke-width="1.2"/><circle cx="310" cy="190" r="11" fill="url(#steel-mz)" stroke="#15171A" stroke-width="1.2"/><circle cx="388" cy="192" r="11" fill="url(#steel-mz)" stroke="#15171A" stroke-width="1.2"/>
  <!-- 激振器 -->
  <rect x="304" y="212" width="52" height="34" fill="url(#steel-mz)" stroke="#15171A" stroke-width="1.4"/>
  <text x="330" y="234" class="s" text-anchor="middle">激振器</text>
  <g stroke="#B0470E" stroke-width="1.3" fill="none">
    <path d="M290 252 q10 8 20 0 q10 -8 20 0"/>
    <path d="M290 268 q10 8 20 0 q10 -8 20 0"/>
  </g>
  <text x="330" y="296" class="s" text-anchor="middle">高频振动：抛射＋自转＋公转</text>
  <text x="490" y="130" class="h">棒 / 段 / 球介质</text>
  <text x="490" y="148" class="s">粉碎同时均匀混合</text>
  <text x="170" y="130" class="h" text-anchor="end">中药专用机型</text>
  <text x="170" y="148" class="s" text-anchor="end">直接对接</text></g>
</svg>