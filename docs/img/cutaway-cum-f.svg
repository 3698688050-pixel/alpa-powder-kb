  <text x="330" y="128" class="h" text-anchor="middle">转子锤片</text>
  <!-- 筛网（弧形，包住下半圈） -->
  <path d="M238 200 a92 92 0 0 0 184 0" fill="none" stroke="#8B9098" stroke-width="2.2"
        stroke-dasharray="2 5"/>
  <text x="330" y="306" class="s" text-anchor="middle">筛网孔径决定出料粒径</text>
  <line x1="330" y1="96" x2="330" y2="140" stroke="#15171A" stroke-width="1.4" marker-end="url(#ar-cum-f)"/>
  <text x="330" y="88" class="s" text-anchor="middle">进料</text>
  <path d="M234 268 H150" stroke="#1F6B43" stroke-width="1.6" marker-end="url(#arg-cum-f)"/>
  <text x="150" y="286" class="s">出料（穿过筛网）</text></g>
