<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img">

  <defs>
    <pattern id="tex-mqp" patternUnits="userSpaceOnUse" width="880" height="705">
      <image href="tex-steel.jpg" width="880" height="705" preserveAspectRatio="xMidYMid slice"/>
    </pattern>
    <linearGradient id="steel-mqp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ECEDEA"/>
      <stop offset=".18" stop-color="#F7F8F5"/>
      <stop offset=".55" stop-color="#EEEFF0"/>
      <stop offset="1" stop-color="#DDDFE1"/>
    </linearGradient>
    <marker id="ar-mqp" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0 0 L6 3.5 L0 7" fill="none" stroke="#15171A" stroke-width="1.1"/>
    </marker>
    <marker id="arb-mqp" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0 0 L6 3.5 L0 7" fill="none" stroke="#1A4FA0" stroke-width="1.1"/>
    </marker>
    <marker id="arg-mqp" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0 0 L6 3.5 L0 7" fill="none" stroke="#1F6B43" stroke-width="1.1"/>
    </marker>
  </defs>
<style>
  .h{font:600 12.5px -apple-system,"PingFang SC",sans-serif;fill:#15171A}
  .s{font:11.5px -apple-system,"PingFang SC",sans-serif;fill:#6E747B}
</style>
<rect width="860" height="470" fill="#FBFBF9"/>
<!-- 整机居中：主体锚点 (140..580, 60..420) 平移到画布中心 -->
<g transform="translate(28, 6)">
  <!-- 圆盘腔体：整体居中于画布 -->
  <g>
     <path d="M262 235 a168 92 0 1 0 336 0 a168 92 0 1 0 -336 0 z" fill="url(#steel-mqp)" stroke="none"/>
     <path d="M262 235 a168 92 0 1 0 336 0 a168 92 0 1 0 -336 0 z" fill="url(#tex-mqp)" opacity=".32" stroke="none"/>
     <path d="M262 235 a168 92 0 1 0 336 0 a168 92 0 1 0 -336 0 z" fill="none" stroke="#15171A" stroke-width="1.6" />
   </g>
  <!-- 内圈：分级区 -->
  <ellipse cx="430" cy="235" rx="97.44" ry="51.52" fill="none"
           stroke="#C9CCC7" stroke-width="1" stroke-dasharray="5 4"/>
  <!-- 中心进料喷射器 -->
  <circle cx="430" cy="235" r="17" fill="url(#steel-mqp)" stroke="#15171A" stroke-width="1.5"/>
  <path d="M334 81 L404 145" stroke="#15171A" stroke-width="1.4"
        fill="none" marker-end="url(#ar-mqp)"/>
  <text x="330" y="73" class="s" text-anchor="end">加料喷射器</text>

  <!-- 四组切线喷嘴：沿圆周切向，左右镜像 -->
  <g stroke="#B0470E" stroke-width="1.8" fill="none">
    <path d="M288 189 L336 207"/>
    <path d="M572 189 L524 207"/>
    <path d="M288 281 L336 263"/>
    <path d="M572 281 L524 263"/>
  </g>
  <text x="250" y="313" class="s" text-anchor="end">切线喷嘴：高压气流沿壁面切向喷入</text>

  <!-- 细粉从中心向上引出 -->
  <path d="M430 218 V117" stroke="#1F6B43" stroke-width="1.7"
        fill="none" marker-end="url(#arg-mqp)"/>
  <text x="442" y="109" class="s">细粉从中心引出</text>

  <!-- 结构说明 -->
  <text x="612" y="173" class="h">无传动部件</text>
  <text x="612" y="191" class="s">自分级结构</text>
  <text x="612" y="213" class="s">无死角、无存料风险</text>
  <text x="612" y="235" class="s">清洁与防爆验证最容易</text>

  <text x="430" y="383" class="s" text-anchor="middle">物料沿壁面切向撞击、摩擦而粉碎，更适于团聚体打散还原</text></g>
</svg>