<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img">

  <defs>
    <pattern id="tex-rtm" patternUnits="userSpaceOnUse" width="880" height="705">
      <image href="tex-steel.jpg" width="880" height="705" preserveAspectRatio="xMidYMid slice"/>
    </pattern>
    <linearGradient id="steel-rtm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ECEDEA"/>
      <stop offset=".18" stop-color="#F7F8F5"/>
      <stop offset=".55" stop-color="#EEEFF0"/>
      <stop offset="1" stop-color="#DDDFE1"/>
    </linearGradient>
    <marker id="ar-rtm" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0 0 L6 3.5 L0 7" fill="none" stroke="#15171A" stroke-width="1.1"/>
    </marker>
    <marker id="arb-rtm" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0 0 L6 3.5 L0 7" fill="none" stroke="#1A4FA0" stroke-width="1.1"/>
    </marker>
    <marker id="arg-rtm" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0 0 L6 3.5 L0 7" fill="none" stroke="#1F6B43" stroke-width="1.1"/>
    </marker>
  </defs>
<style>
  .h{font:600 12.5px -apple-system,"PingFang SC",sans-serif;fill:#15171A}
  .s{font:11.5px -apple-system,"PingFang SC",sans-serif;fill:#6E747B}
</style>
<rect width="860" height="470" fill="#FBFBF9"/>
<!-- 整机居中：主体锚点 (140..580, 60..420) 平移到画布中心 -->
<g transform="translate(28, 6)">
  <g>
     <path d="M228 120 h224 a14 14 0 0 1 14 14 v128 a14 14 0 0 1 -14 14 h-224 a14 14 0 0 1 -14 -14 v-128 a14 14 0 0 1 14 -14 z" fill="url(#steel-rtm)" stroke="none"/>
     <path d="M228 120 h224 a14 14 0 0 1 14 14 v128 a14 14 0 0 1 -14 14 h-224 a14 14 0 0 1 -14 -14 v-128 a14 14 0 0 1 14 -14 z" fill="url(#tex-rtm)" opacity=".32" stroke="none"/>
     <path d="M228 120 h224 a14 14 0 0 1 14 14 v128 a14 14 0 0 1 -14 14 h-224 a14 14 0 0 1 -14 -14 v-128 a14 14 0 0 1 14 -14 z" fill="none" stroke="#15171A" stroke-width="1.6" />
   </g>
  <!-- 多层涡流刀头 -->
  <line x1="248" y1="152" x2="432" y2="152"
        stroke="#15171A" stroke-width="1.3"/>
      <text x="440" y="156" class="s">第 1 层</text><line x1="248" y1="182" x2="432" y2="182"
        stroke="#15171A" stroke-width="1.3"/>
      <text x="440" y="186" class="s">第 2 层</text><line x1="248" y1="212" x2="432" y2="212"
        stroke="#15171A" stroke-width="1.3"/>
      <text x="440" y="216" class="s">第 3 层</text><line x1="248" y1="242" x2="432" y2="242"
        stroke="#15171A" stroke-width="1.3"/>
      <text x="440" y="246" class="s">第 4 层</text>
  <!-- 涡流回旋箭头 -->
  <path d="M280 200 a46 46 0 1 1 92 0" fill="none" stroke="#B0470E" stroke-width="1.4"
        marker-end="url(#ar-rtm)" stroke-dasharray="7 5"/>
  <text x="340" y="212" class="s" text-anchor="middle">强涡流 120 m/s</text>
  <text x="340" y="232" class="s" text-anchor="middle">停留时间极短，温升低</text>
  <line x1="340" y1="78" x2="340" y2="120" stroke="#15171A" stroke-width="1.4" marker-end="url(#ar-rtm)"/>
  <text x="340" y="70" class="s" text-anchor="middle">进料</text>
  <path d="M466 236 H626" stroke="#1F6B43" stroke-width="1.6" marker-end="url(#arg-rtm)"/>
  <text x="474" y="254" class="s">出料</text>
  <text x="214" y="300" class="s">专治团聚体：打散而不破坏一次粒径</text></g>
</svg>