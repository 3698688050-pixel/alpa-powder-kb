# 选型决策规则（每条都带出处与理由，不做无出处的推断）

# ---------- 一、粒度 → 路线（手册 §7.2 原文口径） ----------

size_routes:
  - mesh: "20~300 目"
    um: "约 850~53 μm（目数×孔径≈15000）"
    route: 机械粉碎 · 针盘磨 / 锤式磨
    products: [cum-p, cum-f, rtm]
    reason: 这个区间机械磨足够，气流磨的能耗全花在不必要的地方。手册明确「首选机械粉碎机」。
    source: manual §7.2
  - mesh: "100~1500 目"
    um: "约 150~10 μm"
    route: 机械粉碎 · 空气分级磨
    products: [csm]
    reason: 机械磨里只有带分级轮的一体机才能稳定卡到 10μm 量级；纯靠筛网的机型到不了。
    source: manual §7.2
  - mesh: "325~5000 目"
    um: "约 45~3 μm"
    route: 气流粉碎
    products: [mqw, mql, mqp]
    reason: 机械磨的温度与磨损在细端失控，气流磨的低温自磨特性在这里变成刚需。
    source: manual §7.2
  - mesh: ">5000 目 / 亚微米"
    um: "<3 μm，要到 0.5~1 μm"
    route: 蒸汽动能磨
    products: [steam-jet]
    reason: 压缩空气的极限在 D50 约 2μm；再细只能换介质，用过热蒸汽把出口速度提到 1020m/s。
    source: manual §7.2 与 FAQ 36/60，web_en

# ---------- 二、能耗成本比（这是「为什么首选机械磨」的量化依据） ----------

energy:
  statement: 粉碎同一物料到相同粒度，气流粉碎机的能耗是机械粉碎机的 2~3 倍
  source: manual §7.2
  implication: 只要机械磨能达标，选机械磨；选气流磨失败的唯一正当理由是粒度、纯度或温升做不到。

# ---------- 三、物料属性 → 是否能否决机械磨 ----------

material_gates:
  - attr: 莫氏硬度
    mechanical_limit: 5 以上不建议用机械粉碎机
    jet_limit: 9 以下可用气流磨
    detail:
      - {range: "≤5", route: 机械磨可，气流磨可}
      - {range: "5~7", route: 优先气流磨；圆盘式气流磨限 7 以下，流化床可到 9}
      - {range: "7~9", route: 只能气流磨（流化床/蒸汽磨），且关键部件建议陶瓷}
    solution: 高硬度物料用耐磨合金或陶瓷锤头/齿圈/喷嘴延长寿命
    source: manual §7.1 3.2.1、§3.2、§3.4、FAQ 63/64
  - attr: 含水量
    mechanical_limit: 一般不超过 10%
    detail: 超了要么先干燥，要么改用能对接热风的机型（蜂巢磨/涡流磨可干燥打散一体）
    source: manual §7.1 3.2.2、§3.8
  - attr: 熔点 / 软化点
    detail: 机械磨粉碎室比环境高约 30℃，热敏、低熔点物料要走气流磨（粉碎过程一般不高于 30℃）
    solution: 机械磨可选高温/低温/常温设计、空气密闭循环、惰性气体循环
    source: manual §7.1 3.2.3、FAQ 81、§3.4
  - attr: 韧性（中草药/植物类有机弹性粉体）
    detail: 弹性物料在机械磨里被打扁而不是打碎，宜用振动磨（中药专用）或剪切型转子磨
    source: manual §7.1 3.2.4
  - attr: 脆性
    detail: 脆性物料机械磨效率最高，是机械磨的主场
    source: manual §7.1 3.2.5
  - attr: 粘性
    detail: 易粘壁、糊叶轮锤头的物料，机械磨效率骤降；圆盘式气流磨无死角、无存料风险，更适合
    source: manual §7.1 3.2.6、§3.2
  - attr: 静电性
    detail: 塑料类高速运转易起静电、粘壁难分离，需考虑防静电与气流路线
    source: manual §7.1 3.2.7
  - attr: 易燃易爆
    detail: 金属粉末、部分易爆化工粉、医药粉（国外基本要求）需惰性气体保护；可选防爆设计或升级氮气循环系统
    source: manual §7.2.4、§3.1
  - attr: 纯度要求
    detail: 要求零污染时，内衬/分级轮/喷嘴选氧化铝、氧化锆、碳化硅陶瓷，实现全程金属零接触；金属异物增量控制在 PPM 级
    source: manual §3.1、FAQ 41/49

# ---------- 四、同族内部怎么选（横向差异） ----------

family_choice:
  - pair: [mqw, mql]
    question: 流化床气流磨，卧式还是立式分级轮？
    answer: 卧式（MQW）分级精度高、稳定性高，适合 Dmax 顶点切割要求高的产品；立式（MQL）传动轴偏长转速受限，但能耗较低、适合分级粒度不极端的情况
    source: FAQ 29、§3.1
  - pair: [mqw, mqp]
    question: 流化床气流磨 vs 圆盘式气流磨？
    answer: 流化床内置精密分级轮，粒度调整方便、产品更细，但拆装清洗麻烦、投资高；圆盘式在满足粒度时产量更高、能耗更省、投资更低
    source: FAQ 42
  - pair: [single, multi]
    question: 单转子还是多转子？
    answer: 多转子较单转子可实现更高产量，易大型化（滑石 D50≤3μm 可达 57t/h）；每个转子带速度传感器
    source: §3.1
  - pair: [csm, cump]
    question: 空气分级磨 vs 针盘磨？
    answer: 要 10μm 量级且可调，用带分级轮的 CSM；只要几十微米又要大产能与低发热，用棒销式针盘磨
    source: §3.4 与 §3.6 特点对照
  - pair: [classifier, csm]
    question: 我需要更细的粉，是买分级机还是粉碎机？
    answer: 分级机不减小粒径。进料本身够细、只想切掉粗头或多切几个粒度段，买分级机；进料粗、需要磨，买粉碎机
    source: §3.5 与 FAQ 34

# ---------- 五、手感：口径陷阱 ----------

caveats:
  items:
    - "客户说「100 目左右即可」但答不出通过率：这种客户通常对通过率没有严格要求，别按 D97 死卡"
    - "客户说「微米级」：必须问清是平均粒径还是 D97/D90，这是最常见的一次返工来源"
    - "行业约定粒度：西药 D90、碳酸钙 D97、石英粉 D90~D95、覆铜板高纯石英测 325 目水筛（D99 或 D100）"
    - "客户同时要求多个指标（325 目水筛全通、刮板检测大颗粒个数）：选型要格外注意，不能只看一个 D 值"
    - "产能要问清是小时、天还是年；按天算要确认是 8/10/24 小时；按年算要确认是 8000/7200/6000 小时"
    - "目数换算：目数 × 孔径(μm) ≈ 15000，只作粗估，各国标准不同，中国用美国标准"
  source: manual §7.1 4.x、§7.2.3、§8.2

# ---------- 六、选型前必须问到的信息（价值线索） ----------

intake_checklist:
  items:
    - {group: 客户基础, items: [公司名称, 联系人, 电话, 邮箱]}
    - {group: 物料特性, items: [物料名称, 水分, 密度(堆密度/真密度), 流动性/有无粘性, 原料粒度, 出料粒度及标准(D50/D97/D90/Dmax), 粒度分布, 产量]}
    - {group: 特殊要求, items: [是否防爆, 粉碎温度, 环境粉尘控制, 惰性气体, 纯度/金属污染, 清洗要求]}
    - {group: 项目信息, items: [部门与职务, 计划时间, 投资状况, 新上或扩建, 是否用过类似设备]}
  source: manual §9.1

# ---------- 七、商务要素 ----------

commercial:
  lead_time: 一般 90 天，大型项目约 120 天；最快 60~70 天（加急走绿色通道）
  payment: 行业惯例 3/6/1（30% 首付、发货前 60%、10% 质保一年）；个别项目 3/3/3/1
  warranty: 一年，人为损坏与易损件除外
  scope: 设备含粉碎主机/分级机、旋风分离器、除尘器、引风机、电控柜；电线电缆与压缩气源通常客户自配
  install: 公司仅提供安装指导，工程师到现场指导安装
  wear_parts:
    - 气流磨：喷嘴，每台一般 4 个，大部分物料可用半年以上
    - 机械磨：磨块（锤头/刀片）8~12 个，大部分物料半年以上；齿圈寿命约为磨块 2 倍
    - 陶瓷件：动件 6~12 个月，静件 2~3 年
  source: manual §7.3、FAQ 16/17/22/43/63/64/71/76

# ---------- 八、常见需求 → 答案速查 ----------

quick_answers:
  - q: 粒度最细能到多少？
    a: 干法一般 2μm 左右；蒸汽磨部分物料可到亚微米（<1μm）。常规气流磨压缩空气介质 D50 极限约 2μm，过热蒸汽约 1μm
    src: FAQ 36/60
  - q: 收率能到多少？
    a: 正常连续生产收率 99% 以上（与细度、流动性、含水率有关），负压运行无粉尘外漏
    src: FAQ 45
  - q: 温度多少？
    a: 气流磨一般不高于 30℃（绝热膨胀吸热）；机械磨粉碎室比环境高约 30℃
    src: FAQ 81
  - q: 一台设备几个人？
    a: 单机生产线 1~2 人；大型线用 DCS 集中控制，现场只巡检
    src: FAQ 62
  - q: 能连续运转多久？
    a: 24 小时连续，年生产时间 8000 小时以上
    src: FAQ 80
  - q: 分级轮怎么控粒度？
    a: 调转速。质量大的颗粒离心力大被甩远，质量小的向心力占优穿过分级轮成为细粉；还受密度、水分、形状影响，需实验验证
    src: FAQ 34
  - q: 怎么避免粒度波动？
    a: 稳定加料（螺杆加料或称重传感器控料位）＋稳定进气压力＋稳定风量与压差并自动调节
    src: FAQ 35
  - q: 带旋风与不带旋风的区别？
    a: 带旋风可将部分细粉赶入收尘器，旋风收集的产品超细粉含量更低、分布更窄，但增加成本与占地；旋风与除尘器收集的是粗细两种物料
    src: FAQ 31
  - q: 旋风收集效率？
    a: 一般 90~95%，最高 98~99%，与粒度、密度、水分、流动性有关
    src: FAQ 32
  - q: 除尘器选型？
    a: 主流滤袋式，覆膜后可高效收集 2μm 以上颗粒、精度 99.99%；2μm 以下细粉多建议塑烧板；排放标准已提高到 30mg/m³，一线城市更严
    src: FAQ 33
  - q: 螺杆加料还是振动加料？
    a: 螺杆更精确、波动小；要求磨损小、无死角、易清洗则振动加料更合适
    src: FAQ 46
  - q: 皮带传动还是电机直连？
    a: 推荐皮带传动：普通标准电机即可实现高转速，价格低、故障率低、维修方便；直连电机是非标定制，价格高、故障率高、维修麻烦
    src: FAQ 30
  - q: 设备为什么个头大？
    a: 技术图纸源于德国 IVA 并改良，德方设计保守、宁大勿小以避免影响性能
    src: FAQ 44
