# 埃尔派产品主数据
# 来源标注规则见 data/README.md：manual=员工培训手册(2022内训版) catalogue=2024样册 web_cn/web_en=官网
# 每一条选型边界都能追溯到原文，不做推断填充

families:
  - id: air-jet
    cn: 气流粉碎
    en: Jet Milling
    principle: 压缩空气（或过热蒸汽）经拉瓦尔喷嘴加速，物料在高速气流交汇点自碰撞、摩擦、剪切而粉碎，靠气流分级轮控粒。
    positioning: 干法能达到最细粒度的路线。粒度细、纯度高、温升低，代价是能耗高。

  - id: mechanical
    cn: 机械粉碎
    en: Mechanical Milling
    principle: 靠转子高速冲击＋齿圈/锤头剪切摩擦把物料打碎，配分级轮或筛网控粒。
    positioning: 同粒度下能耗只有气流粉碎的 1/2～1/3，是首选路线；受硬度与温升限制。

  - id: classification-only
    cn: 纯分级
    en: Classification
    principle: 不粉碎，只把已有粉体按粒径切开，靠分级轮离心力与二次风淘洗。
    positioning: 用于球磨/雷蒙/振动磨后接、或来料本身就够细只想切段。

  - id: line
    cn: 整线
    en: Production Line
    principle: 粗破＋球磨/振动磨＋分级＋收集，闭路循环。
    positioning: 大产能、粒度要求不极端的量产物料，投资与运行成本的平衡方案。

  - id: modified
    cn: 表面改性
    en: Surface Modification
    principle: 在粉碎或打散的同时把改性剂包覆到颗粒表面。
    positioning: 卖的是工艺不是单机，通常与粉碎主机组合。

  - id: aux
    cn: 实验室与辅助
    en: Lab & Auxiliary
    principle: 试验用小设备与产线配套件。
    positioning: 售前验证与整线成配套。

products:
  # ============ 气流粉碎 ============
  - id: mqw
    cn: MQW 系列流化床式气流磨
    en: MQW Fluidized Bed Jet Mill
    family: air-jet
    cname: 流化床式气流磨
    en_page: fluidized-bed-jet-mill
    series: [MQW 单转子, MQW 多转子]
    principle: 压缩空气过滤干燥后经拉瓦尔喷嘴高速喷入粉碎腔，多股高压气流交汇处物料反复碰撞、摩擦、剪切而粉碎；上升气流带料至分级区，高速旋转的分级涡轮产生离心力使粗细分离，细粉过分级轮进旋风＋除尘器，粗粉下落继续粉碎。
    size_range: {d50_min: 1, d50_max: 45, d97: "3~45"}
    feed_size: {mqw03: "<1mm", mqw06: "<2mm", mqw20: "<3mm", mqw40: "<5mm"}
    capacity_tph: 10
    power: 空压机配套，最大 1000kW
    hardness_limit: 莫氏 9 以下
    features:
      - 粒形好、粒度分布窄，转子变频调速可灵活调整分布
      - 高精度分级转子线速度 80m/s（官网口径 65m/s 陶瓷转子），顶点切割准
      - 完全自磨，设备耐磨，产品纯度高
      - 内衬/分级轮/喷嘴可选氧化铝、氧化锆、碳化硅陶瓷，全程零金属接触
      - 风筛式二次风设计，能量利用率高
      - 恒温或低温无介质粉碎，适合热敏、低熔点、含糖、挥发性物料
      - 可与多级分级机串联，一次出多个粒度段
      - 可选防爆、氮气循环
    constraints:
      - 拆装清洗比圆盘式麻烦，设备投资更高
      - 能耗是机械粉碎的 2~3 倍，非高附加值物料不划算
    applications: [硬质矿物, 高纯度材料, 热敏材料, 磁性材料, 矿物原料, 化工, 制药, 食品, 复合材料]
    case: 江西某锂业碳酸锂产线（复购 10 套）；深圳某电动车企磷酸铁锂/单晶三元产线（累计 20 台以上）
    edge: 同族里唯一能做到顶点切割准、Dmax 卡得死。卧式分级轮配 80m/s 线速度，粒度分布最窄。
    edge: 同族里唯一能做到顶点切割准、Dmax 卡得死。卧式分级轮配 80m/s 线速度，粒度分布最窄。
    source: [manual §3.1, web_cn, web_en]
    learn_why: 这是公司的旗舰机型。它代表「粒度优先」的极端答案——只要能自磨就不磨损、只要用气流就低温。凡是客户要 D50 个位数微米又要高纯度，先想它。

  - id: mql
    cn: MQL 系列流化床式气流磨
    en: MQL Vertical Fluidized Bed Jet Mill
    family: air-jet
    cname: 流化床式气流磨
    series: [MQL 单转子, MQL 多转子]
    principle: 立式单/多转子结构，原理同 MQW，转子垂直安装。
    size_range: {d50_min: 2, d50_max: 45, d97: "6~150"}
    feed_size: "<3mm（小机型）～<5mm（大机型）"
    capacity_tph: 12
    hardness_limit: 莫氏 9 以下
    features:
      - 1 个垂直安装的分级转子，最高线速度 70m/s
      - 立式单转子结构能实现大产能，效率高、投资省
      - 电机可皮带连接或直联
      - 其余同 MQW：自磨、陶瓷防护、氮气/防爆可选
    constraints:
      - 立式分级轮传动轴偏长，转速受限，顶点切割不如卧式
      - 适合分级粒度相对不极端（D97 6~150μm）的场合
    applications: [硬质矿物, 高纯度材料, 热敏材料, 磁性材料, 矿物原料, 化工, 制药, 食品]
    edge: 同族里投资最省、最容易做大产能。立式单转子，效率高，但顶点切割不如卧式。
    source: [manual §3.1, web_cn]
    learn_why: 与 MQW 的区别是「立式 vs 卧式分级轮」。立式好做大产能、投资省；卧式精度高。客户要 Dmax 卡得死就要卧式，要产量和投资就立式。

  - id: mqp
    cn: MQP 系列圆盘式气流磨
    en: MQP Disc Jet Mill
    family: air-jet
    cname: 圆盘式气流磨
    en_page: disc-jet-mill
    series: [MQP, MQP 医药专用, MQPW]
    principle: 压缩气体通过加料喷射器把原料带入粉碎室，多喷嘴高速气流切线喷向粉碎壁摩擦粉碎；通过调节粉碎室纵深、粉碎压力、加料速度控制细度。
    size_range: {d50_min: 1.5, d50_max: 45}
    capacity_tph: 6
    hardness_limit: 莫氏 7 以下
    features:
      - 喷嘴数量多，粉碎效率高
      - 无传动部件，自分级结构
      - 无死角、无存料风险，易实现防爆验证，清洁极其简单
      - 更适于团聚体的打散还原
      - 满足粒度时产量更高、能耗更省、投资更低（相对流化床）
      - 医药专用机型满足 GMP，09 年即进入制药行业
    constraints:
      - 粉碎细度可控性差于流化床，粒度调整不灵活
      - 无分级轮，粒度不能任意调
    applications: [精细化学品, 食品, 矿物材料, 高级药品, 高纯度材料, 热敏材料, 磁性材料]
    case: 医药行业市占率约 50%，上百家制药企业在用
    edge: 同族里唯一无传动部件。无死角、无存料风险，清洁和防爆验证最容易，GMP 场景首选。
    source: [manual §3.2, web_cn, web_en]
    learn_why: 这是「够用就好」的性价比答案。客户只要求 D50 十几微米、物料价值一般、又要清洗方便（医药/食品换批频繁），圆盘式比流化床更划算——尤其 GMP 场景看重无死角。

  - id: steam-jet
    cn: 蒸汽动能磨
    en: Supersonic Steam Jet Mill
    family: air-jet
    cname: 蒸汽动能磨
    en_page: steam-jet-mill
    series: [S-MQW, S-MQL]
    principle: 由常规气流磨升级，用高温过热蒸汽作动能介质，特殊设计拉瓦尔喷嘴带动物料高速碰撞粉碎，粉碎后进入强制涡流分级，整个干法完成。
    size_range: {d50_min: 0.5, d50_max: 10}
    capacity_tph: 10
    key_params:
      steam_pressure: 8~40 bar
      steam_temp: 230~360 ℃
      nozzle_exit_velocity: 1020 m/s
    hardness_limit: 莫氏 9 以下（同气流磨体系）
    features:
      - 干法可做到亚微米乃至纳米级（D50 0.5μm 起，部分物料 <1μm）
      - 过热蒸汽本身带干燥作用
      - 蒸汽黏度低于空气，更易获得细颗粒
      - 能量利用率高，运行成本低于传统气流磨
      - 完全自磨、陶瓷防护、多级串联、称重控制、防爆氮气等选项齐全
    constraints:
      - 需要蒸汽源（锅炉/余热），没有蒸汽的厂上不了
      - 高温高压密封是技术门槛，也是它的壁垒
    applications: [钢渣/矿渣/粉煤灰等大宗固废, 碳酸钙/滑石/石英等非金属矿, 碳酸锂/磷酸铁锂/白炭黑等新材料]
    case: 辽宁某化工矿业滑石 400kg/h；福建某化工沉淀法白炭黑 1t/h；山西某电力粉煤灰 5t/h；四川某钢铁钢渣 4t/h；重庆某能源磷酸铁锂 2t/h
    edge: 同族里唯一能下到亚微米。压缩空气到 D50 约 2μm 就到顶，换过热蒸汽才继续往下走。
    source: [manual §3.3, web_cn, web_en]
    learn_why: 当客户说「我要亚微米」，常规气流磨到 D50 2μm 就到顶了，唯一答案是蒸汽磨。它的经济性来自蒸汽比压缩空气便宜，所以固废这种低价值大宗料才用得起。

  # ============ 机械粉碎 ============
  - id: csm
    cn: 空气分级磨（CSM 系列）
    en: Air Classifying Mill (CSM)
    family: mechanical
    cname: 空气分级磨
    en_page: air-classifying-mill
    series: [CSM-V, CSM-H, CSM-VD, CSM-HJ]
    principle: 物料均匀送入粉碎室，受高速旋转粉碎盘强烈冲击，在粉碎盘与定子间受碰撞、剪切、摩擦而粉碎；随气流到分级区，变频调节分级轮分离粗细，细粉进旋风＋除尘器，粗粉返回二级粉碎。
    size_range: {d50_min: 1.5, d50_max: 45}
    capacity_tph: 3
    hardness_limit: 莫氏 5 以下
    moisture_limit: 一般不超过 10%
    temp_rise: 不采取降温措施时粉碎室温度比环境高约 30℃
    features:
      - 粉碎分级一体化，调分级轮转速即得目标粒径
      - 结构紧凑、占地小、易拆装清洗、无死角（CSM-V）
      - 装机功率低、应用范围广、性价比高
      - 粉碎转子可换棒状/锤状等形状以适配物料
      - 锤头、齿圈、分级轮可选陶瓷，零金属接触
      - 助力液压翻转＋侧开门，一人可检修
      - PLC 程序控制，分级权限管理，振动传感器预警
      - 可高温/低温/常温设计，空气密闭循环、惰性气体循环
    constraints:
      - 硬度 5 级以上不建议用（磨损与效率双输）
      - 含水率一般不能超 10%
      - 有温升，热敏物料需配冷却或改走气流磨
      - 粘性、静电性强的物料易粘壁、糊锤头
    applications: [食品, 矿物, 精细化学品, 制药/化妆品, 涂料, 颜料/染料, 电池正负极材料]
    case: 天津某新材料钴酸锂/三元产线（累计 50 套以上）；烟台某化工聚氨酯树脂粉碎线
    edge: 机械磨里唯一带分级轮、能把粒度稳定卡到 10μm 量级的。
    source: [manual §3.4 与 §7.2, web_cn, web_en]
    learn_why: 这是销量主力，也是「首选机械粉碎机」原则的落点。它回答了最常见的问题：客户要 100~1500 目，CSM 就够，不必上气流磨。

  - id: cum-p
    cn: CUM-P 系列针盘磨
    en: CUM-P Pin Mill
    family: mechanical
    cname: 针盘磨
    en_page: cum-p-pin-mill
    principle: 物料受高速旋转粉碎动盘冲击，同时在静盘、齿圈间受摩擦、剪切、碰撞而粉碎；动盘与静盘可按物料特性组合不同结构。
    size_range: {d50_min: 10, d50_max: 45}
    capacity_tph: 10
    features:
      - 无筛网结构，出料流畅，产能高，运行成本低
      - 棒销式粉体盘，发热量低
      - 可采用双动力，线速度 200m/s 以上，获得更大粉碎力
      - 装配间隙控制 2~3mm
      - PLC 程序控制、振动预警
      - 可匹配旋风脉冲除尘器、真空输送单元，实现无尘操作
    constraints:
      - 粒度偏粗（D50 10μm 起），做不到气流磨那种细度
      - 硬度过高物料磨损快
    applications: [化工, 无机盐, 医药, 食品, 颜料, 染料, 农药, 电池材料, 矿物, 耐火材料]
    case: 山东某食品厂白砂糖（山梨醇大厂）；台湾某化工厂碳酸钙改性替代进口双动力针盘磨
    edge: 机械磨里产能最猛、发热最低。无筛网棒销盘，线速度可到 200m/s，20-300 目量产首选。
    source: [manual §3.6, web_cn, web_en]
    learn_why: 20~300 目的推荐机型。客户说「打到 80 目、200 目」— 这就是答案，别上气流磨。

  - id: cum-f
    cn: CUM-F 系列锤式磨
    en: CUM-F Hammer Mill
    family: mechanical
    cname: 锤式磨
    en_page: cum-f-hammer-mill
    principle: 转子上的锤片高速旋转，将物料破碎研磨；靠锤片转速与筛网孔径控制粒径。
    size_range: {d50_min: 10, d50_max: 850}
    capacity_tph: 2
    features:
      - 靠筛网孔径控粒，结构最简单
      - 适合粗碎到细碎的大跨度
    constraints:
      - 粒径靠筛网，调细能力有限
      - 温升与磨损同机械磨体系
    applications: [粗碎/细碎通用, 食品, 化工, 矿物]
    edge: 机械磨里粒度跨度最大。靠筛网孔径控制，从粗碎一直做到细碎，结构最简单。
    source: [web_cn, web_en]
    learn_why: 粒度最粗的一档（最粗到 850μm，约 20 目）。在整线里通常扮演粗破角色。

  - id: rtm
    cn: RTM 系列涡流磨
    en: RTM Turbo Mill
    family: mechanical
    cname: 涡流磨
    en_page: rtm-turbo-mill
    principle: 靠转子在腔内形成强涡流流场，物料相互冲击与剪切而粉碎，停留时间极短。
    size_range: {d50_min: 1, d50_max: 250}
    capacity_tph: 6
    features:
      - 强大涡流流场，线速度可达 120m/s
      - 物料停留时间极短，温升低
      - 特别适用于团聚物料的打散还原
    constraints:
      - 粒度跨度大但极细端不如气流磨稳定
    applications: [团聚物料打散, 化工, 食品, 矿物]
    edge: 机械磨里专治团聚体。涡流流场线速度 120m/s，停留时间极短，打散而不破坏一次粒径。
    source: [manual §3.9, web_cn, web_en]
    learn_why: 「团聚体打散」是它的专属场景——很多纳米材料买来是团块，先要还原成一次粒径。这是气流磨之外更省钱的打散方案。

  - id: ulm
    cn: ULM 系列转子磨
    en: ULM Turbo Mill
    family: mechanical
    cname: 粉碎用转子磨
    en_page: ulm-turbo-mill
    principle: 粉碎转子由多层粉碎盘与多个粉碎刀片组成，靠高速剪切与冲击粉碎。
    size_range: {d50_min: 3, d50_max: 45}
    capacity_tph: 4.5
    features:
      - 粉碎效率高
      - 可用于团聚物打散、含水物料粉碎干燥、纤维物料粉碎
    applications: [团聚物打散, 含水物料干燥粉碎, 纤维物料]
    edge: 机械磨里唯一明确能做纤维物料。多层刀片结构，纤维不缠刀。
    source: [manual §3.10, web_cn, web_en]
    learn_why: 纤维物料（如植物纤维、某些有机粉体）用锤磨会缠刀，转子磨的多层刀片结构就是为这类物料设计的。

  - id: ulm-g
    cn: ULM-G / 蜂巢磨（干燥打散改性用转子磨）
    en: Rotor Mill for Drying, Dispersing and Modifying
    family: mechanical
    cname: 干燥打散改性用涡流磨
    en_page: rotor-mill-for-drying-dispersing-and-modifying
    principle: 立轴上装多个转子，多层粉碎刀头形成强剪切与打散力，可对接热风源，一机同时完成干燥、打散、改性。
    size_range: {d50_min: 1, d50_max: 250}
    capacity_tph: 4.5
    features:
      - 集干燥与粉碎于一体，比传统干燥节能 30%~50%
      - 带连锁安全装置
      - 可同时做表面改性
    applications: [高含水物料, 需同步改性的粉体, 化工, 矿物]
    edge: 同族里唯一把干燥、打散、改性合成一台。比传统先干燥再粉碎再改性省 30-50% 能耗。
    source: [manual §3.8, web_cn, web_en]
    learn_why: 当客户物料含水率高、又要改性，常规做法是先干燥再粉碎再改性三台设备，蜂巢磨一台顶三台，这是它的卖点也是节能 30-50% 的来源。

  - id: mz
    cn: MZ 系列振动磨
    en: MZ Vibration Mill
    family: mechanical
    cname: 振动磨
    en_page: mz-vibration-mill
    series: [MZ, MZ 中药专用]
    principle: 磨筒内研磨介质（棒、段、球）在激振器高频振动下做抛射、自转、公转运动，对物料产生冲击、摩擦、剪切，实现超细粉碎与均匀混合。
    size_range: {d50_min: 2.5, d50_max: 150}
    capacity_tph: 3
    features:
      - 介质研磨，可同时混合
      - 有中药专用机型
    constraints:
      - 有研磨介质，高纯度要求的物料要考虑介质污染
    applications: [矿物, 中药, 需要混合的粉体]
    edge: 机械磨里唯一能边磨边混。介质研磨，中药专用机型可直接对接。
    source: [manual §3.11, web_cn, web_en]
    learn_why: 中药场景很多是「粉碎＋混匀」同时要，振动磨天然满足。纯度要求高的不要用它。

  - id: ring-roller
    cn: 雷蒙磨/环辊磨（RLM）
    en: RLM Ring Roller Mill
    family: mechanical
    cname: 环辊磨
    en_page: rlm-ring-roller-mill
    principle: 磨轮公转＋自转产生离心力，与定子强烈辊研将物料粉碎，合格细粉经分级轮收集。
    size_range: {d50_min: 1.5, d50_max: 45}
    capacity_tph: 5
    applications: [非金属矿, 碳酸钙, 建材]
    edge: 机械磨里最适合当前置磨。辊压式，能耗低，常与分级机串联组成闭路。
    source: [web_cn, web_en]
    learn_why: 手册里把它作为气流分级机/流化床的「可串联粉磨设备」提到（球磨、振动磨、立磨、雷蒙磨），官网单列了 RLM。属于「已有粉磨设备＋后接分级」这条路线里的前置磨。

  # ============ 纯分级 ============
  - id: classifier
    cn: 气流分级机
    en: Air Classifier
    family: classification-only
    cname: 气流分级机
    en_page: classifier
    series: [FL/ITC 立式, FW/HTS 卧式, FL 多级串联]
    principle: 物料随上升气流进入分级区，高速旋转分级涡轮产生离心力使粗细分离，细粉穿过分级轮叶片间隙被收集，粗粉撞壁下落经二次风淘洗后二次分级，从卸料口排出。
    size_range: {d50_min: 1, d50_max: 45, d97: "FL/ITC 5~150, FW/HTS 2~150"}
    capacity_tph: 30
    efficiency: 60%~90%（流动性好的物料高，反之下降；ITC10 为 50~80%）
    hardness_limit: 莫氏 6 以上可做陶瓷防护（内部可实现陶瓷防护）
    features:
      - 不粉碎只切段，产品粒度任意可调，品种更换极其方便
      - 可分级球状、片状、针状颗粒，也可按密度分级
      - 立式分级轮转速低、耐磨损、系统功率配置低
      - 可多级串联，同时生产多个粒度段
      - 可与球磨机、振动磨、立磨、雷蒙磨串联组成闭路循环
      - 系统负压运行，粉尘排放 ≤20mg/m³，噪音 ≤80dB(A)
    constraints:
      - 立式分级轮传动轴偏长，转速受限，顶点切割不如卧式
      - 分级效率受物料流动性强烈影响
      - 本身不减小粒径，进料本身得够细
    applications: [碳酸钙, 高岭土, 石英, 滑石, 云母等非金属矿, 化工, 冶金, 磨料, 陶瓷, 耐火材料, 医药, 农药, 食品, 新材料]
    case: 中建材石英研磨分级线；贵州某锰业二氧化锰分级线
    edge: 全库唯一不粉碎的机型。进料已经够细、只想切段或多切几个粒度段时用它，别再买磨。
    source: [manual §3.5, 2024 分级机样册, web_cn, web_en]
    learn_why: 很多人把它和「粉碎机」混为一谈。它不粉碎。客户说「我现在的粉 D97 太粗、想切掉粗头」，答案是分级机，不是再买一台磨。

  # ============ 整线 ============
  - id: ball-line
    cn: 球磨分级生产线
    en: Ball Mill + Classifying Production Line
    family: line
    cname: 球磨分级生产线
    en_page: ball-mill-and-classifying-production-line
    principle: 物料粗破后经可控加料进球磨机，研磨介质靠磨机旋转动能反复冲击研磨；出料经负压送入分级机，合格细粉收集，粗粉回球磨，形成闭路循环。
    size_range: {d50_min: 2, d50_max: 45}
    capacity_tph: 11
    features:
      - 大产能、运行成本低
      - 球磨机可选型（手册单列「产线中选用的球磨机」）
      - 闭路循环，粒度由分级机决定
    constraints:
      - 有研磨介质，高纯度物料需考虑污染
      - 系统占地大、投资高
    applications: [非金属矿, 石英, 碳酸钙, 建材, 磨料]
    case: 中建材集团石英球磨分级产线
    edge: 同族里吨成本最低。球磨加分级闭路，碳酸钙 D97 10μm 单线年产可达 10 万吨。
    source: [manual §3.13, web_cn, web_en]
    learn_why: 大宗低价值矿物的量产答案。它的逻辑是「用便宜的球磨把料磨细，用分级机保证粒径」，比气流磨省电得多，代价是纯度与占地。

  # ============ 改性 ============
  - id: coating
    cn: 粉体包覆改性机
    en: Powder Coating / Surface Modification
    family: modified
    cname: 粉体包覆改性
    en_page: /
    series: [涡流磨改性机, 蜂巢磨改性机, 三辊磨改性机, 针盘磨改性机, 高速搅拌改性机]
    principle: 在机械剪切与打散的同时，把改性剂（硬脂酸、硅烷等）包覆到颗粒表面，形成单分子层。
    features:
      - 五种载体机型的改性方案，按物料与改性剂选
      - 可与粉碎工序合并
    applications: [碳酸钙改性, 颜料, 填料, 电池材料]
    edge: 全库唯一卖工艺不卖单机。五种载体机型配不同改性剂，可与粉碎工序合并。
    source: [manual §3.12, web_cn]
    learn_why: 改性是「同一种粉卖不同价」的关键工序。客户问「活化度」「吸油值」，就是这一块。

  # ============ 实验室与辅助 ============
  - id: lab
    cn: 实验室设备
    en: Laboratory Equipment
    family: aux
    cname: 实验室设备
    en_page: laboratory-equipment
    series: [三合一实验室粉碎分级机, MQP01 实验室气流磨, CUM180 万能磨, FS05 惯性分级机, MZ03 振动磨]
    features:
      - 小批量验证机型，覆盖气流磨/机械磨/分级/振动磨四条路线
      - 公司实验室配马尔文 3000 激光粒度仪（0.03~300μm，干湿两用）
    edge: 全库唯一覆盖四条路线的验证机型。寄料小试先把参数跑出来，再谈选型。
    source: [manual §3.14, web_cn, web_en]
    learn_why: 售前必用。手册反复强调「寄料到实验室做试验再选型」，这套设备就是那个流程的工具。

  - id: aux
    cn: 辅助设备
    en: Auxiliary Equipment
    family: aux
    cname: 辅助设备
    en_page: parts
    series: [真空输送器, 无尘投料仓, 皮带秤, 除铁器, 金属检测仪, 自动拆包机, 包装机, 关风卸料阀, 开袋站, 空气锤, 流化器, 气力输送机]
    edge: 全库唯一构成整线闭环的一类。喂料、输送、除铁、包装，主机之外的都在这。
    features:
      - 构成整线的喂料、输送、除铁、包装闭环
      - 主机之外的辅机可按客户要求外购或由公司配套
    source: [manual §3.15, web_cn]
    learn_why: 报价时最容易被忽略的一块。手册第七条问答明确：设备除主机外还包括旋风、除尘器、引风机、电控柜，而电线电缆和压缩气源通常客户自配。